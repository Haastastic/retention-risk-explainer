name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Workaround: claude-code-action@v1 has been failing to install its own
      # `claude` binary on the runner ("Claude Code native binary not found at
      # /home/runner/.local/bin/claude"). Install it explicitly first. Remove
      # this step once the action bootstraps reliably again.
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The `code-review` plugin (plugin_marketplaces/plugins inputs) is not
          # used — the action currently also fails to load it. Review prompt is
          # inlined instead; restore the plugin form once upstream is fixed.
          prompt: |
            Review the diff on this pull request for correctness bugs, security
            issues, broken tests, and clear design problems. This repo builds an
            explainable, fairness-audited attrition-risk model — pay attention to
            the layer boundary (the LLM narrates, it never produces or alters the
            risk score) and to protected-attribute / age-proxy leakage into model
            features.

            Use `mcp__github_inline_comment__create_inline_comment` to leave a
            comment on each specific line that has a real issue. Keep comments
            concise and actionable. Do not comment on style or formatting — Ruff
            already gates that. If you find nothing worth flagging, say so briefly
            and post no comments.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
