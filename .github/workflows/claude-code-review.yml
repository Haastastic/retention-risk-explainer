name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOTE: the `code-review` plugin (plugin_marketplaces/plugins inputs) is
          # deliberately not used — claude-code-action@v1 currently fails to load it
          # ("posix_spawn '/home/runner/.local/bin/claude'"). The review prompt is
          # inlined instead; restore the plugin form once that upstream bug is fixed.
          prompt: |
            Review the diff on this pull request for correctness bugs, security
            issues, broken tests, and clear design problems. This repo builds an
            explainable, fairness-audited attrition-risk model — pay attention to
            the layer boundary (the LLM narrates, it never produces or alters the
            risk score) and to protected-attribute / age-proxy leakage into model
            features.

            Use `mcp__github_inline_comment__create_inline_comment` to leave a
            comment on each specific line that has a real issue. Keep comments
            concise and actionable. Do not comment on style or formatting — Ruff
            already gates that. If you find nothing worth flagging, say so briefly
            and post no comments.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
