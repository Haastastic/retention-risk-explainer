# Project tooling config. Packaging metadata is intentionally omitted — the code
# is run in-tree (Streamlit app, scripts, tests), not installed as a distribution.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # run in-tree without an editable install
# --cov-fail-under is a floor with headroom (the suite sits at ~100%); it exists
# to catch a PR that adds a code path with no test, not to chase every line.
addopts = "-q --cov=retention_risk --cov-report=term-missing --cov-fail-under=95"
filterwarnings = [
    # shap imports trip matplotlib colormap deprecations we can't fix here
    "ignore:.*set_(bad|over|under).*:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]  # lint notebooks alongside .py files

[tool.ruff.lint]
# E/F  = pyflakes + pycodestyle (the flake8 core)
# I    = import sorting (replaces isort)
# B    = flake8-bugbear (likely-bug patterns)
# UP   = pyupgrade (modern syntax)
# SIM  = flake8-simplify
# PD   = pandas-vet (guards against slow / fragile DataFrame patterns)
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: allow unused expressions (cell output) and star imports.
"*.ipynb" = ["B018", "F403", "F405"]
